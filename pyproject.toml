[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renewalos"
version = "0.1.0"
description = "Synthetic B2B revenue reconciliation and account-health decision-support project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "pandas",
    "polars",
    "dbt-duckdb",
    "streamlit",
    "plotly",
    "scikit-learn",
    "ortools",
    "pydantic",
]

[project.scripts]
renewalos-generate-raw = "renewalos.generation.validate_generation:main"
renewalos-load-raw = "renewalos.warehouse.load_raw:main"
renewalos-validate-quality = "renewalos.quality.validation:main"
renewalos-validate-health = "renewalos.health.validation:main"
renewalos-run-prioritization = "renewalos.prioritization.optimizer:main"
renewalos-validate-prioritization = "renewalos.prioritization.validation:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src"]
warn_unreachable = true
